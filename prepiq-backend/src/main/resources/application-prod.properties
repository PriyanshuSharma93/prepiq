spring.application.name=backend

# Database connection - from environment variable (set in Render dashboard)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Gemini API
gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=gemini-flash-latest
gemini.api.fallback-model=gemini-flash-lite-latest

# Server port (Render provides this via PORT env var)
server.port=${PORT:8080}